name: 05 smoke gates
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ['codex/05-**', 'feature/05-**', 'test/05-**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dataset:
    name: Dataset tools / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r 05_dataset_testing/requirements.txt
      - run: python -B 05_dataset_testing/run_checks.py --suite dataset --report dataset-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset-smoke-${{ matrix.python }}
          path: dataset-smoke.json
          if-no-files-found: error
  backend:
    name: Backend + detector + synthetic HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r 05_dataset_testing/requirements-smoke.txt
      - run: python -B 05_dataset_testing/run_checks.py --suite backend --report backend-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-smoke
          path: backend-smoke.json
          if-no-files-found: error
  frontend:
    name: Frontend tests + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --prefix apps/web
      - run: python -B 05_dataset_testing/run_checks.py --suite frontend --report frontend-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-smoke
          path: frontend-smoke.json
          if-no-files-found: error
